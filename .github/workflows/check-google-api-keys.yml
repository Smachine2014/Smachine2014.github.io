name: Check Google API keys

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  google-api-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check all reachable commit snapshots
        run: python3 scripts/check-google-api-keys.py --all-history
